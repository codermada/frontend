<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Animation + Media Demo</title>
  </head>

  <body>

    <header class="box">
      <h1>Animation + Media Queries Demo</h1>
      <p>Resize the screen + watch animations change</p>
    </header>

    <main>

      <section class="box">
        <h2>Basic Animation</h2>
        <div class="box-animate"></div>
      </section>

      <section class="box">
        <h2>Responsive Animation (media query)</h2>
        <div class="responsive-box"></div>
        <p>Resize window: animation changes on small screens</p>
      </section>

      <section class="box">
        <h2>Floating Pulse Button</h2>
        <button class="pulse-btn">Click Me</button>
      </section>

    </main>

  </body>
</html>
