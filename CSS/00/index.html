<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Feature Showcase</title>
  </head>

  <body>

    <header class="header">
      <h1 id="main-title">CSS Showcase</h1>
      <p class="subtitle">Learning CSS features step by step</p>
    </header>

    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main class="container">

      <section class="card">
        <h2>Selectors</h2>
        <p class="text">This uses class selectors.</p>
        <p id="unique">This uses an ID selector.</p>
      </section>

      <section class="card highlight">
        <h2>Pseudo Classes</h2>
        <button class="btn">Hover me</button>
      </section>

      <section class="card">
        <h2>Box Model</h2>
        <div class="box-model">Padding, border, margin</div>
      </section>

      <section class="card flex-demo">
        <h2>Flexbox</h2>
        <div class="flex-container">
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
        </div>
      </section>

      <section class="card grid-demo">
        <h2>Grid</h2>
        <div class="grid-container">
          <div>A</div>
          <div>B</div>
          <div>C</div>
          <div>D</div>
        </div>
      </section>

      <section class="card">
        <h2>Pseudo Elements</h2>
        <p class="quote">CSS makes styling powerful</p>
      </section>

    </main>

    <footer class="footer">
      <p>Footer content here</p>
    </footer>

  </body>
</html>
